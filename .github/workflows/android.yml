# TuAcademia (v38) — Compila y firma las apps Android en GitHub (se puede lanzar desde el celular).
# GitHub → pestaña Actions → "Apps Android" → Run workflow → elegir la rama → Run workflow.
# Resultado: un "Release" con tuacademia-play.aab (para Google Play) y tuacademia.apk (APK directo),
# y el APK se guarda en public/descargas/tuacademia.apk de la misma rama.
# Necesita el secreto TV_CLAVE_FIRMA (Settings → Secrets and variables → Actions).
name: Apps Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/generar.js'
      - 'android/compilar.sh'
permissions:
  contents: write
jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Revisar el secreto de la firma
        env:
          TV_CLAVE_FIRMA: ${{ secrets.TV_CLAVE_FIRMA }}
        run: |
          if [ -z "$TV_CLAVE_FIRMA" ]; then echo "::error::Falta el secreto TV_CLAVE_FIRMA (Settings → Secrets and variables → Actions → New repository secret)"; exit 1; fi
      - name: Compilar y firmar
        env:
          TV_CLAVE_FIRMA: ${{ secrets.TV_CLAVE_FIRMA }}
        run: bash android/compilar.sh
      - name: Publicar los archivos (Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -o "VERSION_NOMBRE = '[^']*'" android/generar.js | cut -d"'" -f2)
          ETIQ="app-v${VER}-${GITHUB_RUN_NUMBER}"
          gh release create "$ETIQ" android/salida/tuacademia-play.aab android/salida/tuacademia.apk \
            --target "$GITHUB_SHA" --title "Apps Android ${VER} (compilación ${GITHUB_RUN_NUMBER}, rama ${GITHUB_REF_NAME})" \
            --notes "tuacademia-play.aab → subir a Google Play Console. tuacademia.apk → APK directo (precios normales)."
      - name: Guardar el APK en la rama
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add public/descargas/tuacademia.apk
          if git diff --cached --quiet; then echo "El APK no cambió"; else git commit -m "APK directo compilado por GitHub Actions [skip ci]" && git push; fi
